<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="'Segoe UI','Microsoft JhengHei',sans-serif">
  <rect x="0" y="0" width="1180" height="900" fill="#f8f9fa"/>
  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">RS485_C 硬體架構 — 深鏈 1-2-3-7</text>
  <text x="590" y="56" text-anchor="middle" font-size="13" fill="#868e96">中繼器全 RP2040(MicroPython, 非5V容忍) · 末端全 STM32(C++, FT 5V容忍) · 收發器 MAX13487EESA(5V) · bus 38400</text>

  <!-- 色彩圖例 -->
  <g font-size="12" fill="#495057">
    <rect x="40" y="70" width="14" height="14" fill="#e03131"/><text x="60" y="82">5V</text>
    <rect x="110" y="70" width="14" height="14" fill="#1971c2"/><text x="130" y="82">3.3V</text>
    <rect x="185" y="70" width="14" height="14" fill="#2f9e44"/><text x="205" y="82">A/B 差動</text>
    <rect x="285" y="70" width="14" height="14" fill="#495057"/><text x="305" y="82">GND 共地</text>
    <rect x="385" y="70" width="14" height="14" fill="#f08c00"/><text x="405" y="82">分壓/偏壓電阻</text>
  </g>

  <!-- ===================== Panel 1：系統鏈 ===================== -->
  <text x="40" y="120" font-size="16" font-weight="700" fill="#212529">① 系統鏈（4 條獨立 RS485 段）</text>

  <!-- 板子 -->
  <g font-size="11">
    <!-- PC -->
    <rect x="30" y="165" width="70" height="58" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
    <text x="65" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1971c2">PC</text>
    <text x="65" y="208" text-anchor="middle" fill="#495057">監看D</text>
    <!-- dongle -->
    <rect x="130" y="160" width="105" height="68" rx="6" fill="#fff" stroke="#343a40"/>
    <text x="182" y="182" text-anchor="middle" font-weight="700">USB-485</text>
    <text x="182" y="199" text-anchor="middle" fill="#495057">dongle</text>
    <text x="182" y="215" text-anchor="middle" fill="#868e96">(自帶收發器)</text>
    <!-- R1 -->
    <rect x="300" y="150" width="128" height="92" rx="6" fill="#fff" stroke="#e8590c" stroke-width="2"/>
    <text x="364" y="172" text-anchor="middle" font-weight="700" fill="#e8590c">R1 · 中繼器</text>
    <text x="364" y="190" text-anchor="middle">RP2040-Lite</text>
    <text x="364" y="207" text-anchor="middle" font-weight="700">addr 1</text>
    <text x="364" y="224" text-anchor="middle" fill="#495057">MCU 3V3 / VCC 5V</text>
    <!-- R2 -->
    <rect x="490" y="150" width="128" height="92" rx="6" fill="#fff" stroke="#e8590c" stroke-width="2"/>
    <text x="554" y="172" text-anchor="middle" font-weight="700" fill="#e8590c">R2 · 中繼器</text>
    <text x="554" y="190" text-anchor="middle">RP2040-ETH#1</text>
    <text x="554" y="207" text-anchor="middle" font-weight="700">addr 2</text>
    <text x="554" y="224" text-anchor="middle" fill="#495057">MCU 3V3 / VCC 5V</text>
    <!-- R3 -->
    <rect x="680" y="150" width="128" height="92" rx="6" fill="#fff" stroke="#e8590c" stroke-width="2"/>
    <text x="744" y="172" text-anchor="middle" font-weight="700" fill="#e8590c">R3 · 中繼器</text>
    <text x="744" y="190" text-anchor="middle">RP2040-ETH#2</text>
    <text x="744" y="207" text-anchor="middle" font-weight="700">addr 3</text>
    <text x="744" y="224" text-anchor="middle" fill="#495057">MCU 3V3 / VCC 5V</text>
    <!-- T7 -->
    <rect x="870" y="150" width="140" height="92" rx="6" fill="#fff" stroke="#2b8a3e" stroke-width="2"/>
    <text x="940" y="172" text-anchor="middle" font-weight="700" fill="#2b8a3e">T7 · 末端</text>
    <text x="940" y="190" text-anchor="middle">STM32 (FT)</text>
    <text x="940" y="207" text-anchor="middle" font-weight="700">addr 7</text>
    <text x="940" y="224" text-anchor="middle" fill="#495057">RO 直接免分壓</text>
  </g>

  <!-- 連線 -->
  <g stroke-width="2">
    <line x1="100" y1="194" x2="130" y2="194" stroke="#868e96"/>
    <line x1="235" y1="194" x2="300" y2="196" stroke="#2f9e44" stroke-width="3"/>
    <line x1="428" y1="196" x2="490" y2="196" stroke="#2f9e44" stroke-width="3"/>
    <line x1="618" y1="196" x2="680" y2="196" stroke="#2f9e44" stroke-width="3"/>
    <line x1="808" y1="196" x2="870" y2="196" stroke="#2f9e44" stroke-width="3"/>
  </g>
  <g font-size="11" fill="#2b8a3e" text-anchor="middle" font-weight="700">
    <text x="115" y="186" fill="#868e96">USB</text>
    <text x="267" y="184">busU</text>
    <text x="459" y="186">busM</text>
    <text x="649" y="186">busL</text>
    <text x="839" y="186">busXL</text>
  </g>
  <g font-size="10" fill="#868e96" text-anchor="middle">
    <text x="459" y="212">A/B/GND</text>
    <text x="649" y="212">A/B/GND</text>
    <text x="839" y="212">A/B/GND</text>
  </g>

  <!-- 路徑說明 -->
  <text x="40" y="272" font-size="12" fill="#495057">產生路徑：<tspan font-weight="700" fill="#212529">T7 → 1-2-3-7</tspan>（每經一台中繼器前綴一段位址；PC 送 REQ|7 → 收 1-2-3-7|{…,"age":N}）</text>

  <!-- 供電條 -->
  <rect x="30" y="288" width="1120" height="30" rx="4" fill="#fff3bf" stroke="#f08c00"/>
  <text x="42" y="308" font-size="12" fill="#5c3d00">供電：全部 USB → 有源 HUB → <tspan font-weight="700">5V(VBUS)</tspan> 供收發器；各板板載穩壓 → <tspan font-weight="700">3V3</tspan> 給 MCU；<tspan font-weight="700">全系統共地(GND)</tspan>。每段 bus 各自終端+偏壓。</text>

  <!-- ===================== Panel 2：單段電氣詳圖 ===================== -->
  <text x="40" y="360" font-size="16" font-weight="700" fill="#212529">② 單段 RS485 詳圖 — 電壓 / 分壓 / 偏壓 / 終端（左＝RP2040 中繼器端，右＝STM32 末端端）</text>

  <!-- 5V 與 GND 匯流排 -->
  <line x1="60" y1="395" x2="1120" y2="395" stroke="#e03131" stroke-width="2.5"/>
  <text x="66" y="390" font-size="12" font-weight="700" fill="#e03131">+5V</text>
  <line x1="60" y1="720" x2="1120" y2="720" stroke="#495057" stroke-width="2.5"/>
  <text x="66" y="738" font-size="12" font-weight="700" fill="#495057">GND（共地）</text>

  <!-- 左 MCU RP2040 -->
  <rect x="60" y="470" width="130" height="150" rx="6" fill="#fff" stroke="#e8590c" stroke-width="2"/>
  <text x="125" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#e8590c">RP2040</text>
  <text x="125" y="550" text-anchor="middle" font-size="12">中繼器端</text>
  <text x="125" y="572" text-anchor="middle" font-size="11" fill="#c92a2a">非 5V 容忍</text>
  <text x="125" y="588" text-anchor="middle" font-size="11" fill="#c92a2a">(腳≤3.6V)</text>
  <text x="196" y="505" font-size="11" fill="#1971c2">TX</text>
  <text x="196" y="600" font-size="11" fill="#1971c2">RX</text>

  <!-- 左 MAX -->
  <rect x="300" y="470" width="140" height="150" rx="6" fill="#fff" stroke="#343a40" stroke-width="1.5"/>
  <text x="370" y="535" text-anchor="middle" font-size="12" font-weight="700">MAX13487</text>
  <text x="370" y="552" text-anchor="middle" font-size="12" font-weight="700">EESA</text>
  <text x="370" y="572" text-anchor="middle" font-size="11" fill="#e03131" font-weight="700">VCC = 5V</text>
  <text x="370" y="588" text-anchor="middle" font-size="10" fill="#868e96">AutoDir 免DE</text>
  <text x="296" y="505" text-anchor="end" font-size="11">DI</text>
  <text x="296" y="600" text-anchor="end" font-size="11">RO</text>
  <text x="444" y="505" font-size="11">A</text>
  <text x="444" y="600" font-size="11">B</text>
  <!-- VCC 5V -->
  <line x1="370" y1="470" x2="370" y2="395" stroke="#e03131" stroke-width="2"/>

  <!-- TX->DI 直接 3.3V -->
  <line x1="190" y1="500" x2="300" y2="500" stroke="#1971c2" stroke-width="2"/>
  <text x="245" y="493" text-anchor="middle" font-size="10" fill="#1971c2">TX 3.3V 直接 (VIH≈2V)</text>

  <!-- RO -> 分壓 -> RX -->
  <line x1="300" y1="595" x2="270" y2="595" stroke="#343a40" stroke-width="2"/>
  <rect x="234" y="587" width="36" height="16" fill="#ffec99" stroke="#f08c00"/>
  <text x="252" y="599" text-anchor="middle" font-size="10" font-weight="700" fill="#5c3d00">1.8k</text>
  <circle cx="220" cy="595" r="3" fill="#343a40"/>
  <line x1="234" y1="595" x2="220" y2="595" stroke="#343a40" stroke-width="2"/>
  <line x1="220" y1="595" x2="190" y2="595" stroke="#343a40" stroke-width="2"/>
  <line x1="220" y1="595" x2="220" y2="660" stroke="#343a40" stroke-width="2"/>
  <rect x="202" y="655" width="36" height="16" fill="#ffec99" stroke="#f08c00"/>
  <text x="220" y="667" text-anchor="middle" font-size="10" font-weight="700" fill="#5c3d00">3.3k</text>
  <line x1="220" y1="671" x2="220" y2="720" stroke="#495057" stroke-width="2"/>
  <text x="150" y="648" font-size="10" fill="#e8590c" font-weight="700">分壓 5V→3.24V</text>

  <!-- Bus 匯流排 A / B -->
  <line x1="440" y1="500" x2="760" y2="500" stroke="#2f9e44" stroke-width="3"/>
  <line x1="440" y1="595" x2="760" y2="595" stroke="#2f9e44" stroke-width="3"/>
  <text x="600" y="492" text-anchor="middle" font-size="11" font-weight="700" fill="#2b8a3e">A</text>
  <text x="600" y="612" text-anchor="middle" font-size="11" font-weight="700" fill="#2b8a3e">B</text>

  <!-- 左終端 120Ω -->
  <line x1="470" y1="500" x2="470" y2="595" stroke="#f08c00" stroke-width="2"/>
  <rect x="452" y="538" width="36" height="16" fill="#ffec99" stroke="#f08c00"/>
  <text x="470" y="550" text-anchor="middle" font-size="10" font-weight="700" fill="#5c3d00">120Ω</text>
  <text x="470" y="638" text-anchor="middle" font-size="9" fill="#868e96">終端(左端)</text>

  <!-- 偏壓：A 上拉 560 到 5V, B 下拉 560 到 GND -->
  <line x1="540" y1="500" x2="540" y2="440" stroke="#f08c00" stroke-width="2"/>
  <rect x="522" y="452" width="36" height="16" fill="#ffec99" stroke="#f08c00"/>
  <text x="540" y="464" text-anchor="middle" font-size="10" font-weight="700" fill="#5c3d00">560Ω</text>
  <line x1="540" y1="440" x2="540" y2="395" stroke="#e03131" stroke-width="2"/>
  <line x1="540" y1="595" x2="540" y2="672" stroke="#f08c00" stroke-width="2"/>
  <rect x="522" y="660" width="36" height="16" fill="#ffec99" stroke="#f08c00"/>
  <text x="540" y="672" text-anchor="middle" font-size="10" font-weight="700" fill="#5c3d00">560Ω</text>
  <line x1="540" y1="676" x2="540" y2="720" stroke="#495057" stroke-width="2"/>
  <text x="600" y="452" font-size="10" fill="#e8590c" font-weight="700">偏壓 failsafe（整段一組·放主端R1）</text>
  <text x="600" y="466" font-size="9" fill="#868e96">13487 內建 true-failsafe → 可選(加強雜訊餘裕)</text>

  <!-- 右終端 120Ω -->
  <line x1="730" y1="500" x2="730" y2="595" stroke="#f08c00" stroke-width="2"/>
  <rect x="712" y="538" width="36" height="16" fill="#ffec99" stroke="#f08c00"/>
  <text x="730" y="550" text-anchor="middle" font-size="10" font-weight="700" fill="#5c3d00">120Ω</text>
  <text x="730" y="638" text-anchor="middle" font-size="9" fill="#868e96">終端(右端)</text>

  <!-- 右 MAX -->
  <rect x="760" y="470" width="140" height="150" rx="6" fill="#fff" stroke="#343a40" stroke-width="1.5"/>
  <text x="830" y="535" text-anchor="middle" font-size="12" font-weight="700">MAX13487</text>
  <text x="830" y="552" text-anchor="middle" font-size="12" font-weight="700">EESA</text>
  <text x="830" y="572" text-anchor="middle" font-size="11" fill="#e03131" font-weight="700">VCC = 5V</text>
  <text x="756" y="505" text-anchor="end" font-size="11">A</text>
  <text x="756" y="600" text-anchor="end" font-size="11">B</text>
  <text x="904" y="505" font-size="11">DI</text>
  <text x="904" y="600" font-size="11">RO</text>
  <line x1="830" y1="470" x2="830" y2="395" stroke="#e03131" stroke-width="2"/>

  <!-- 右 MCU STM32 -->
  <rect x="960" y="470" width="160" height="150" rx="6" fill="#fff" stroke="#2b8a3e" stroke-width="2"/>
  <text x="1040" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#2b8a3e">STM32</text>
  <text x="1040" y="550" text-anchor="middle" font-size="12">末端端</text>
  <text x="1040" y="572" text-anchor="middle" font-size="11" fill="#2b8a3e">FT 5V 容忍</text>
  <text x="1040" y="588" text-anchor="middle" font-size="11" fill="#2b8a3e">RO 直接接</text>
  <text x="956" y="505" text-anchor="end" font-size="11" fill="#1971c2">TX</text>
  <text x="956" y="600" text-anchor="end" font-size="11">RX</text>

  <!-- 右 TX->DI, RO->RX -->
  <line x1="900" y1="500" x2="960" y2="500" stroke="#1971c2" stroke-width="2"/>
  <text x="930" y="493" text-anchor="middle" font-size="10" fill="#1971c2">3.3V</text>
  <line x1="900" y1="595" x2="960" y2="595" stroke="#343a40" stroke-width="2"/>
  <text x="930" y="588" text-anchor="middle" font-size="10" fill="#2b8a3e" font-weight="700">RO 直接(FT)</text>

  <!-- 底部規則 -->
  <rect x="30" y="760" width="1120" height="120" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="45" y="782" font-size="13" font-weight="700" fill="#212529">接線規則</text>
  <g font-size="12" fill="#343a40">
    <text x="45" y="804">1. 收發器 VCC 一律 <tspan fill="#e03131" font-weight="700">5V</tspan>（板子 5V/VBUS 腳）；MCU 邏輯 <tspan fill="#1971c2" font-weight="700">3.3V</tspan>。收發器由「它連的那片板子」就近供電。</text>
    <text x="45" y="824">2. <tspan fill="#e8590c" font-weight="700">RP2040 端</tspan>：RO→RX <tspan font-weight="700">必加分壓</tspan> 1.8k/3.3k(5V→3.24V)；TX→DI 3.3V 直接。每台中繼器 up+down 各一組 → 3 台共 <tspan font-weight="700">6 組</tspan>。</text>
    <text x="45" y="844">3. <tspan fill="#2b8a3e" font-weight="700">STM32 端</tspan>：FT 5V 容忍，RO→RX <tspan font-weight="700">直接接、免分壓</tspan>。</text>
    <text x="45" y="864">4. 每段 bus 兩端各 <tspan fill="#f08c00" font-weight="700">120Ω 終端</tspan>；<tspan fill="#f08c00" font-weight="700">偏壓 560Ω</tspan>(上拉A→5V/下拉B→GND) 整段一組放主端(13487 有 true-failsafe → 可選)；A/B/GND 三線共地。</text>
  </g>
</svg>
